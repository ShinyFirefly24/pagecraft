<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pagecraft</title>
<meta name="description" content="A bullet journal with a new hand-designed look every day.">
<meta name="theme-color" content="#4a2652">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pagecraft">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet" href="">
<style>
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select,[contenteditable]{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html{overflow-x:hidden}
body{background:var(--desk,#e9e4dc);min-height:100vh;font-family:var(--bfont,system-ui);color:var(--ink,#333);padding:0 max(16px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transition:background .5s}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- toolbar (neutral, sits on the desk) ---------- */
.toolbar{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:20;max-width:1100px;margin:12px auto 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2d2d35;font-size:14px}
.tb-left,.tb-right{display:flex;align-items:center;gap:6px}
.tb-btn{border:1px solid rgba(0,0,0,.1);background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;line-height:1;color:#2d2d35;white-space:nowrap}
.tb-btn:hover{background:#f4f3f1}
.tb-btn:disabled{opacity:.45;cursor:default}
.tb-btn.icon{width:34px;padding:8px 0;font-size:17px}
.tb-btn.accent{background:#2d2d35;color:#fff;border-color:#2d2d35}
.tb-btn.accent:hover{background:#45454f}
.tb-date{border:1px solid rgba(0,0,0,.1);border-radius:9px;padding:6px 8px;font:inherit;font-size:13px;color:#2d2d35;background:#fff}
.tb-theme{display:flex;align-items:center;gap:10px;min-width:0;flex:1;justify-content:center}
.swatches{display:flex;padding-left:4px}
.swatches i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;margin-left:-5px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.tinfo{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{color:#7a7a82;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border-radius:12px;box-shadow:0 10px 32px rgba(0,0,0,.16);padding:6px;min-width:210px;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;color:#2d2d35}
.menu button:hover{background:#f3f2ef}
.menu hr{border:0;border-top:1px solid #eee;margin:4px 6px}
.menu-theme{display:none;padding:8px 12px 10px;border-bottom:1px solid #eee;margin-bottom:4px}
.menu-theme .tname{display:block;white-space:normal}
.menu-theme .tsub{white-space:normal}
@media(max-width:760px){
  .toolbar{flex-wrap:nowrap;gap:6px;padding:6px;margin:8px auto 16px}
  .tb-theme,.tb-date,.long{display:none}
  .tb-left,.tb-right{gap:5px}
  .menu-theme{display:block}
}

/* ---------- the page ---------- */
.page{position:relative;max-width:1100px;margin:0 auto;background-color:var(--paper);color:var(--ink);border-radius:8px;padding:34px 40px 28px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 14px 44px rgba(0,0,0,.18);font-size:calc(16px * var(--bs));line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page.anim{animation:pageIn .45s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(10px) rotate(-.3deg)}to{opacity:1;transform:none}}
.paper-dots{background-image:radial-gradient(circle,var(--line) 1.15px,transparent 1.7px);background-size:22px 22px;background-position:11px 11px}
.paper-grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.paper-graph{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(var(--linef) 1px,transparent 1px),linear-gradient(90deg,var(--linef) 1px,transparent 1px);background-size:60px 60px,60px 60px,12px 12px,12px 12px}
.paper-lines{background-image:linear-gradient(transparent 29px,var(--line) 30px);background-size:100% 30px}

/* page decorations */
.deco-rings{padding-left:66px}
.deco-rings::before{content:"";position:absolute;left:20px;top:26px;bottom:26px;width:18px;background:radial-gradient(circle at 9px 9px,var(--desk) 6px,rgba(0,0,0,.22) 7px,transparent 8.5px) 0 0/18px 44px repeat-y}
.deco-tape::before,.deco-tape::after{content:"";position:absolute;top:12px;width:120px;height:28px;opacity:.88;box-shadow:0 1px 2px rgba(0,0,0,.12);pointer-events:none}
.deco-tape::before{left:-28px;transform:rotate(-38deg);background:repeating-linear-gradient(-45deg,var(--a2) 0 7px,var(--a2w) 7px 14px)}
.deco-tape::after{right:-28px;transform:rotate(38deg);background:repeating-linear-gradient(45deg,var(--a3) 0 7px,var(--a3w) 7px 14px)}
.deco-ribbon{margin-bottom:60px}
.deco-ribbon::after{content:"";position:absolute;bottom:-54px;right:90px;width:22px;height:54px;background:var(--a4);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);z-index:-1}
.deco-ribbon{z-index:0}
.deco-corner::before{content:"";position:absolute;right:0;bottom:0;width:46px;height:46px;background:linear-gradient(135deg,var(--paper) 50%,var(--a1l) 50%);border-top-left-radius:6px;box-shadow:-2px -2px 4px rgba(0,0,0,.07)}

/* date header */
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.title{font-family:var(--hfont);font-weight:var(--hw);color:var(--ink);line-height:1.05}
.t-stacked{display:flex;align-items:center;gap:16px}
.t-stacked .t-num{font-size:calc(4.6rem * var(--hs));color:var(--a1t);text-shadow:3px 3px 0 var(--a2l)}
.t-col{display:flex;flex-direction:column;gap:6px}
.t-wd{font-size:calc(2.1rem * var(--hs))}
.t-sub{font-family:var(--bfont);font-weight:400;font-size:.92rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.t-shadow .t-main{display:block;font-size:calc(3.3rem * var(--hs));text-shadow:3px 3px 0 var(--a1l)}
.t-shadow .t-sub{display:block;margin-top:8px}
.t-banner{display:inline-block;background:var(--a1);color:var(--on-a1);padding:12px 48px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 24px) 50%,100% 100%,0 100%,24px 50%);font-size:calc(2.3rem * var(--hs))}
.t-bannerwrap .t-sub{display:block;margin:8px 0 0 26px}
.t-boxed{display:inline-flex;flex-direction:column;align-items:center;border:5px double var(--line3);padding:12px 30px;gap:6px;background:var(--card)}
.t-boxed .t-main{font-size:calc(2.6rem * var(--hs))}
.t-swash{position:relative;padding-bottom:20px;display:inline-block}
.t-swash .t-main{font-size:calc(3.4rem * var(--hs));color:var(--a1t)}
.t-swash .t-sub{display:block;margin-top:6px}
.swoosh{position:absolute;left:-4px;bottom:0;width:100%;min-width:200px;height:18px}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.head-doodles{display:flex;gap:8px;align-items:flex-end}
.head-doodles svg{transform:rotate(var(--rot))}
.weekstrip{display:flex;gap:2px}
.wk{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 3px;border-radius:12px;background:none;border:0;color:var(--soft);font-size:.74rem;min-width:36px}
.wk b{font-size:.95rem;color:var(--ink);font-weight:600;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;transition:background .15s}
.wk:hover b{background:var(--hover)}
.wk.cur b{background:var(--a1);color:var(--on-a1)}
.wk i{width:5px;height:5px;border-radius:50%;background:transparent}
.wk.has i{background:var(--a2t)}
.divider{height:16px;margin:18px 0 6px;background-repeat:repeat-x;background-position:center}

/* ---------- sections ---------- */
#flow{display:flex;flex-direction:column;gap:28px;margin-top:20px}
.cols{display:grid;grid-template-columns:var(--cols,1fr 1fr);gap:28px 30px}
.col{display:flex;flex-direction:column;gap:28px;min-width:0}
.col>.sec:last-child{flex:1}
.box-tools{display:flex;justify-content:center;gap:22px;margin-top:22px;flex-wrap:wrap}
.box-tools .link-btn{padding:0;font-size:.88rem}
.sec{position:relative;padding:18px 18px 16px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.sh{margin:0;font-family:var(--hfont);font-weight:var(--hw);font-size:calc(1.5rem * var(--hs));line-height:1.15;color:var(--ink)}
.sec-doodle{width:28px;height:28px;color:var(--sat);flex:none;transform:rotate(var(--rot,0deg))}
.tilt .sec:nth-child(odd){transform:rotate(-.5deg)}
.tilt .sec:nth-child(even){transform:rotate(.45deg)}

/* box styles */
.box-dashed{border:2px dashed var(--sat);border-radius:14px}
.box-double{border:5px double var(--line3);border-radius:4px}
.box-sketch{border:2px solid var(--line3);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
.box-offset{border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--sa);background:var(--card)}
.box-washi{background:var(--card);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.07);padding-top:26px}
.box-washi::before{content:"";position:absolute;top:-12px;left:50%;width:110px;height:24px;transform:translateX(-50%) rotate(-2.5deg);opacity:.9}
.washi-stripes .box-washi::before{background:repeating-linear-gradient(45deg,var(--sa) 0 7px,var(--saw) 7px 14px)}
.washi-dots .box-washi::before{background:radial-gradient(circle,var(--saw) 2.2px,transparent 2.8px) 0 0/10px 10px,var(--sa)}
.washi-grid .box-washi::before{background:linear-gradient(var(--saw) 1.5px,transparent 1.5px) 0 0/8px 8px,linear-gradient(90deg,var(--saw) 1.5px,transparent 1.5px) 0 0/8px 8px,var(--sa)}
.washi-solid .box-washi::before{background:var(--sa);clip-path:polygon(3% 0,97% 0,100% 20%,97% 40%,100% 60%,97% 80%,100% 100%,3% 100%,0 80%,3% 60%,0 40%,3% 20%)}
.box-brackets{background:
 linear-gradient(var(--sat),var(--sat)) 0 0/24px 3px no-repeat,linear-gradient(var(--sat),var(--sat)) 0 0/3px 24px no-repeat,
 linear-gradient(var(--sat),var(--sat)) 100% 0/24px 3px no-repeat,linear-gradient(var(--sat),var(--sat)) 100% 0/3px 24px no-repeat,
 linear-gradient(var(--sat),var(--sat)) 0 100%/24px 3px no-repeat,linear-gradient(var(--sat),var(--sat)) 0 100%/3px 24px no-repeat,
 linear-gradient(var(--sat),var(--sat)) 100% 100%/24px 3px no-repeat,linear-gradient(var(--sat),var(--sat)) 100% 100%/3px 24px no-repeat}
.box-dotted{border:3px dotted var(--sat);border-radius:22px}
.box-stitch{background:var(--sas);border-radius:14px;outline:2px dashed var(--line3);outline-offset:-8px;padding:22px}
.box-soft{background:var(--sas);border-radius:22px}
.box-polaroid{background:var(--card);padding:18px 18px 28px;box-shadow:0 2px 8px rgba(0,0,0,.14);border-radius:2px}

/* section header styles */
.hdr-ribbon .sh{background:var(--sa);color:var(--on-sa);padding:5px 28px 6px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%)}
.hdr-highlight .sh{background:linear-gradient(transparent 55%,var(--sal) 55%,var(--sal) 92%,transparent 92%);padding:0 6px}
.hdr-wave .sh{text-decoration:underline wavy var(--sat);text-decoration-thickness:2px;text-underline-offset:8px;text-decoration-skip-ink:none}
.hdr-pill .sh{background:var(--sa);color:var(--on-sa);padding:4px 18px 5px;border-radius:999px}
.hdr-label .sh{border:2px solid var(--ink);border-radius:8px;padding:3px 14px 3px 28px;position:relative;background:var(--card)}
.hdr-label .sh::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:2px solid var(--ink)}
.hdr-lines .sh{flex:1;display:flex;align-items:center;gap:12px;white-space:nowrap}
.hdr-lines .sh::before,.hdr-lines .sh::after{content:"";flex:1;height:2px;background:var(--sat);border-radius:2px}
.hdr-shadow .sh{color:var(--sat);text-shadow:2px 2px 0 var(--sal)}
.hdr-tab .sh{background:var(--sa);color:var(--on-sa);padding:6px 16px 4px;border-radius:10px 10px 0 0;box-shadow:0 3px 0 var(--ink)}

/* ---------- daily log ---------- */
.log{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:6px;padding:3px 2px;border-radius:8px}
.item:hover{background:var(--hover)}
.bul{width:26px;height:28px;flex:none;border:0;background:none;font-size:1.3rem;line-height:28px;color:var(--ink);padding:0;border-radius:6px}
.bul.static{cursor:default}
.item.task .bul:hover{background:var(--hover)}
.pm{color:var(--sat);line-height:28px;font-size:.95rem}
.txt{flex:1;min-width:0;padding:4px 3px;outline:none;line-height:1.4;overflow-wrap:anywhere;border-radius:4px}
.txt:focus{background:var(--hover)}
.done .txt{text-decoration:line-through;text-decoration-color:var(--sat);text-decoration-thickness:2px;color:var(--soft)}
.migrated .txt,.migrated .bul{color:var(--soft)}
.note .txt{font-style:italic;color:var(--soft)}
.acts{display:flex;gap:1px;opacity:0;transition:opacity .15s;flex:none}
.item:hover .acts,.item:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:.7}}
.acts button{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--soft);font-size:.95rem;padding:0}
.acts button:hover{background:var(--hover);color:var(--ink)}
.acts .on{color:var(--sat)}
.add{display:flex;align-items:center;gap:8px;margin-top:10px;border-top:1.5px dashed var(--line2);padding-top:12px}
.types{display:flex;border:1.5px solid var(--line2);border-radius:999px;padding:2px;flex:none}
.type-btn{border:0;background:none;width:32px;height:28px;border-radius:999px;font-size:1.05rem;color:var(--soft);padding:0}
.type-btn.on{background:var(--sa);color:var(--on-sa)}
.add input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);padding:6px 2px;outline:none;border-bottom:1.5px solid transparent}
.add input:focus{border-bottom-color:var(--sat)}
input::placeholder,textarea::placeholder{color:var(--soft);opacity:.85}
.key{margin-top:12px;font-size:.78rem;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 14px}
.empty{color:var(--soft);font-style:italic;padding:4px 2px;margin:0 0 6px}
.bring{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--sas);padding:8px 12px;border-radius:12px;margin-bottom:10px;font-size:.92rem}
.bring-acts{display:flex;gap:6px}
.chip-btn{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:.85rem}
.chip-btn.ghost{border-color:transparent;background:none}
.link-btn{border:0;background:none;color:var(--soft);font-size:.82rem;padding:8px 0 0;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}

/* ---------- habits ---------- */
.hab-table{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:9px 12px}
.hab-days{display:flex;gap:4px}
.hab-days svg{width:17px;height:17px;flex:none}
.hab-letters span{width:17px;text-align:center;font-size:.68rem;color:var(--soft)}
.hab-today-lbl{font-size:.68rem;color:var(--soft);text-align:center;text-transform:uppercase;letter-spacing:.08em}
.h-name{overflow-wrap:anywhere;line-height:1.25}
.streak{display:block;font-size:.72rem;color:var(--soft);margin-top:1px}
.h-today{border:0;background:none;padding:0;width:38px;height:38px;transition:transform .15s;justify-self:center}
.h-today:hover{transform:scale(1.1)}
.h-today.on{animation:pop .3s ease}
.h-today svg{width:100%;height:100%}
@keyframes pop{50%{transform:scale(1.25)}}

/* ---------- wellness ---------- */
.well-row{margin-bottom:16px}
.well-row:last-child{margin-bottom:0}
.lbl{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.lbl em{font-style:normal;letter-spacing:.04em;text-transform:none;color:var(--ink);font-size:.88rem}
.moods{display:flex;gap:4px;flex-wrap:wrap}
.mood-btn{border:0;background:none;padding:3px;border-radius:50%}
.mood-btn svg{width:40px;height:40px;display:block;transition:transform .15s,opacity .15s}
.mood-btn:hover svg{transform:scale(1.1)}
.moods.has-sel .mood-btn:not(.sel) svg{opacity:.38}
.mood-btn.sel svg{transform:scale(1.16)}
.waters{display:flex;gap:3px;flex-wrap:wrap}
.water-btn{border:0;background:none;padding:0;width:30px;height:32px}
.water-btn svg{width:100%;height:100%;transition:transform .15s}
.water-btn:hover svg{transform:translateY(-2px)}
.sleep{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line3);background:none;color:var(--ink);font-size:1.05rem;padding:0;line-height:1}
.step:hover{background:var(--hover)}
.sleep-val{min-width:56px;text-align:center;font-weight:600}
.moons{display:flex;gap:2px;flex-wrap:wrap}
.moons svg{width:17px;height:17px}

/* ---------- gratitude & notes ---------- */
.grat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.grat-row svg{width:18px;height:18px;flex:none}
.grat-in{flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--line2);background:none;font:inherit;color:var(--ink);padding:6px 2px;outline:none}
.grat-in:focus{border-bottom:1.5px solid var(--sat)}
.prompt{font-size:.9rem;color:var(--soft);font-style:italic;margin:0 0 6px}
.notes{display:block;width:100%;min-height:150px;resize:vertical;border:0;font:inherit;color:var(--ink);line-height:30px;outline:none;padding:0 2px;background:transparent linear-gradient(transparent 29px,var(--line2) 30px) 0 0/100% 30px}

/* ---------- custom boxes ---------- */
.kept{font-size:.75rem;color:var(--soft);margin:-8px 0 8px;letter-spacing:.06em}
.clist{list-style:none;margin:0;padding:0}
.cl-item{display:flex;align-items:flex-start;gap:6px;padding:2px;border-radius:8px}
.cl-item:hover{background:var(--hover)}
.cl-check{border:0;background:none;padding:4px;width:30px;height:30px;flex:none}
.cl-check svg{width:100%;height:100%;display:block}
.cl-del{border:0;background:none;width:28px;height:28px;color:var(--soft);opacity:0;border-radius:6px;flex:none;padding:0}
.cl-del:hover{background:var(--hover);color:var(--ink)}
.cl-item:hover .cl-del,.cl-item:focus-within .cl-del{opacity:1}
@media (hover:none){.cl-del{opacity:.6}}
.cl-add{width:100%;border:0;border-bottom:1.5px dashed var(--line2);background:none;font:inherit;color:var(--ink);padding:7px 2px;outline:none;margin-top:6px}
.cl-add:focus{border-bottom:1.5px solid var(--sat)}
.cnum-row{display:flex;align-items:baseline;gap:8px}
.cnum{width:8ch;font:inherit;font-size:1.6em;border:0;border-bottom:2px solid var(--line2);background:none;color:var(--ink);padding:2px 4px;outline:none;-moz-appearance:textfield;appearance:textfield}
.cnum::-webkit-inner-spin-button,.cnum::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cnum:focus{border-bottom-color:var(--sat)}
.cunit{color:var(--soft)}
.spark{margin-top:12px}
.spark svg{width:100%;max-width:280px;height:50px;display:block;overflow:visible}
.spark small{color:var(--soft);font-size:.75rem}

.foot{margin-top:26px;display:flex;justify-content:space-between;font-size:.78rem;color:var(--soft);flex-wrap:wrap;gap:6px}
.foot .warn{color:var(--a1t);font-weight:600}

/* ---------- modal (neutral) ---------- */
.modal{position:fixed;inset:0;background:rgba(20,18,25,.5);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{background:#fff;color:#2d2d35;border-radius:16px;max-width:580px;width:100%;max-height:90vh;overflow:auto;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.mhead h3{margin:0;font-size:18px}
.mbtn{border:1px solid rgba(0,0,0,.1);background:#fff;border-radius:8px;min-width:32px;height:32px;font-size:15px;padding:0 10px;color:#2d2d35}
.mbtn:hover{background:#f3f2ef}
.mbtn.dark{background:#2d2d35;color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:11px;text-align:center;color:#888;text-transform:uppercase;letter-spacing:.05em}
.cday{aspect-ratio:1;border:1px solid #ebe9e5;border-radius:10px;background:#fff;padding:5px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;text-align:left;position:relative;overflow:hidden;color:#2d2d35}
.cday:hover{border-color:#bbb}
.cday.today{border-color:#2d2d35}
.cday.sel{box-shadow:0 0 0 2px #2d2d35}
.cday .md{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%}
.cday .sw{display:flex;height:6px;border-radius:3px;overflow:hidden}
.cday .sw i{flex:1}
.cday .hb{height:3px;background:#eee;border-radius:2px;margin-top:3px}
.cday .hb i{display:block;height:100%;background:#2d2d35;border-radius:2px}
.mstats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mstats div{background:#f6f5f2;border-radius:10px;padding:8px 12px;font-size:12px;color:#666}
.mstats b{display:block;font-size:17px;color:#2d2d35}
.hrow{display:flex;gap:8px;margin-bottom:8px}
.hrow input,.hadd input{flex:1;min-width:0;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font:inherit}
.hadd{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.mnote{color:#777;font-size:12.5px;margin:10px 0 0}
.mbtn.dark:hover{background:#45454f}
.seg{display:inline-flex;background:#f1f0ec;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;color:#555}
.seg button.on{background:#fff;color:#2d2d35;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.arr{list-style:none;margin:12px 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #ebe9e5;border-radius:10px;background:#fff;flex-wrap:wrap}
.arow.off .aname{opacity:.45}
.arow.dragging{opacity:.4}
.arow.over{border-color:#2d2d35;box-shadow:0 -2px 0 #2d2d35}
.grip{cursor:grab;color:#999;font-size:18px;user-select:none;-webkit-user-select:none;touch-action:none;width:34px;height:38px;display:grid;place-items:center;margin:-6px 0 -6px -6px;border-radius:8px}
.grip:active{cursor:grabbing;background:#f1f0ec}
.arow.ghost{opacity:.35}
.aname{flex:1;min-width:120px;font-weight:600}
.aname small{display:block;font-weight:400;color:#888;font-size:12px}
.actl{display:flex;gap:4px;flex-wrap:wrap}
.mbtn.sm{height:28px;min-width:28px;font-size:12.5px;padding:0 8px}
.fld{display:block;margin:14px 0 6px;font-weight:600;font-size:13px}
.fin{width:100%;border:1px solid #ddd;border-radius:8px;padding:9px 10px;font:inherit}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{border:1.5px solid #e5e3df;border-radius:10px;padding:10px;text-align:left;background:#fff;font-size:13px;color:#2d2d35}
.tcard b{display:block;font-size:14px;margin-bottom:2px}
.tcard span{color:#777;font-size:12px}
.tcard.on{border-color:#2d2d35;background:#f8f7f4}
.tcard:disabled:not(.on){opacity:.45;cursor:default}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:480px){.tcards,.row2{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2d2d35;color:#fff;padding:10px 16px;border-radius:10px;font-family:system-ui,sans-serif;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  .page{padding:26px 18px 22px}
  .deco-rings{padding-left:40px}
  .deco-rings::before{left:8px}
  #flow{gap:24px}
  .head-right{align-items:flex-start;width:100%}
  .t-stacked .t-num{font-size:calc(3.6rem * var(--hs))}
  .t-shadow .t-main,.t-swash .t-main{font-size:calc(2.5rem * var(--hs))}
  .t-banner{font-size:calc(1.8rem * var(--hs));padding:10px 38px 12px}
  .t-boxed .t-main{font-size:calc(2rem * var(--hs))}
  .tilt .sec{transform:none!important}
  .deco-tape::before,.deco-tape::after{width:64px;top:6px}
  .deco-tape::before{left:-10px}
  .deco-tape::after{right:-4px}
}
@media (pointer:coarse){
  .page{font-size:max(16px,calc(16px * var(--bs)))}
  .tb-btn{min-height:40px}
  .tb-btn.icon{width:40px}
  .bul{width:34px;height:34px;line-height:34px}
  .pm{line-height:34px}
  .txt{padding:6px 3px}
  .acts{display:none;opacity:1}
  .item.sel{background:var(--hover)}
  .item.sel .acts{display:flex}
  .acts button{width:40px;height:40px;font-size:1.05rem}
  .type-btn{width:42px;height:36px}
  .cl-check{width:38px;height:38px}
  .cl-del{display:none;opacity:1;width:40px;height:40px}
  .cl-item.sel{background:var(--hover)}
  .cl-item.sel .cl-del{display:block}
  .h-today{width:42px;height:42px}
  .water-btn{width:36px;height:38px}
  .step{width:40px;height:40px}
  .mood-btn svg{width:42px;height:42px}
  .link-btn{padding:10px 4px}
  .box-tools .link-btn{padding:10px 4px}
  .mbtn{min-height:40px;min-width:40px}
  .mbtn.sm{height:38px;min-width:38px;padding:0 10px}
  .fin,.hrow input,.hadd input,.seg button{font-size:16px}
  .menu button{padding:13px 14px;font-size:15px}
  .cday{font-size:13px}
  .key .hint{display:inline}
}
.key .hint{display:none;width:100%;font-style:italic}
@media(max-width:420px){.wk{min-width:30px}.wk b{width:26px;height:26px;font-size:.85rem}.mood-btn svg{width:36px;height:36px}}
@media print{
  body{background:#fff!important;padding:0}
  .toolbar,.acts,.add,.key,.link-btn,.bring,.toast,.box-tools,.cl-add,.cl-del{display:none!important}
  .page{box-shadow:none;max-width:none;margin:0}
  .deco-ribbon::after{display:none}
}
</style>

const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };

function seedOf(str){ let h = 1779033703 ^ str.length; for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); return (h ^= h>>>16) >>> 0; }
function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function rgb2hex(c){ return '#' + c.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v,i) => v + (y[i]-v)*t)); }
function lum(h){ return hex2rgb(h).map(v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }).reduce((s,v,i) => s + v*[.2126,.7152,.0722][i], 0); }
function contrast(a,b){ const l1 = lum(a), l2 = lum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }
function onColor(bg){ return contrast(bg,'#ffffff') > contrast(bg,'#232129') + 0.6 ? '#ffffff' : '#232129'; }
function readable(acc, paper, ink, min=3){ for (let t=0; t<=1.001; t+=.1){ const c = mix(acc, ink, t); if (contrast(c, paper) >= min) return c; } return ink; }
function rgba(h,a){ const [r,g,b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }

const svgIcon = (name, cls='', style='') => `<svg viewBox="0 0 24 24" class="${cls}" style="${style}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

/* =================== theme generator =================== */
function genTheme(key, roll){
 const r = rng(seedOf(key + '|' + roll));
 const pick = a => a[Math.floor(r() * a.length)];
 const pal = pick(PALETTES);
 const hf = pick(HFONTS), bf = pick(BFONTS);
 const paper = pick(pal.papers || PAPERS);
 const boxA = pick(BOXES), boxB = r() < .45 ? pick(BOXES) : boxA;
 const hdr = pick(HDRS), title = pick(TITLES), divider = pick(DIVIDERS), washi = pick(WASHIS);
 const deco = pick(DECOS), layout = pick(LAYOUTS), habitShape = pick(SHAPE_KEYS), water = pick(WATER_KEYS);
 const motif = pick(pal.motifs), doodles = MOTIFS[motif];
 const tilt = ['washi','polaroid'].includes(boxA) && r() < .6;
 const acc = [1,2,3,4].sort(() => r() - .5);
 const titles = {}; for (const k in SEC_TITLES) titles[k] = pick(SEC_TITLES[k]);
 const seeds = Array.from({length:16}, () => r());
 const prompt = PROMPTS[seedOf(key) % PROMPTS.length];
 const sub = `${hf.n} · ${BOX_NAME[boxA]} · ${PAPER_NAME[paper]} paper`;
 return {pal, hf, bf, paper, boxA, boxB, hdr, title, divider, washi, deco, layout, habitShape, water, doodles, tilt, acc, titles, seeds, prompt, name: pal.name, sub};
}

function applyTheme(th){
 const p = th.pal, root = document.documentElement.style;
 const v = {
  '--desk': p.desk, '--paper': p.paper, '--ink': p.ink,
  '--soft': rgba(p.ink, .64), '--line': rgba(p.ink, p.dark ? .24 : .17), '--linef': rgba(p.ink, p.dark ? .1 : .07),
  '--line2': rgba(p.ink, .28), '--line3': rgba(p.ink, .5), '--hover': rgba(p.ink, .06),
  '--card': p.dark ? mix(p.paper, '#ffffff', .06) : mix(p.paper, '#ffffff', .65),
  '--hfont': `"${th.hf.n}", ${th.hf.f}`, '--bfont': `"${th.bf.n}", ${th.bf.f}`,
  '--hs': th.hf.s, '--hw': th.hf.w, '--bs': th.bf.s,
 };
 p.a.forEach((c,i) => {
  const n = i+1;
  v[`--a${n}`] = c; v[`--on-a${n}`] = onColor(c);
  v[`--a${n}l`] = mix(c, p.paper, .55); v[`--a${n}s`] = mix(c, p.paper, .74);
  v[`--a${n}w`] = mix(c, '#ffffff', .45); v[`--a${n}t`] = readable(c, p.paper, p.ink);
 });
 for (const k in v) root.setProperty(k, v[k]);
 const href = `https://fonts.googleapis.com/css2?family=${th.hf.q}&family=${th.bf.q}&display=swap`;
 const link = $('#fontLink'); if (link.getAttribute('href') !== href) link.setAttribute('href', href);
 const meta = document.querySelector('meta[name=theme-color]') || Object.assign(document.head.appendChild(document.createElement('meta')), {name:'theme-color'});
 meta.content = p.desk;
}

function bringCandidate(k, d){
 if (k !== todayKey() || d.bringDone) return null;
 for (let i = 1; i <= 7; i++){
  const pk = addDays(k, -i), pd = state.days[pk];
  if (pd && pd.items && pd.items.length){
   const open = pd.items.filter(t => t.type === 'task' && (!t.state || t.state === 'open'));
   return open.length ? {key: pk, items: open} : null;
  }
 }

}

function itemHTML(it){

 return `<li class="item ${it.type} ${st} ${selId === it.id ? 'sel' : ''}" data-id="${it.id}">

 h += d.items.length ? `<ul class="log">${d.items.map(itemHTML).join('')}</ul>` : `<p class="empty">Nothing logged yet. Start with one small thing.</p>`;
 h += `<div class="add"><div class="types" role="group" aria-label="Entry type">${['task','event','note'].map(t => `<button class="type-btn ${addType === t ? 'on' : ''}" data-type="${t}" title="${t[0].toUpperCase() + t.slice(1)}" aria-pressed="${addType === t}">${SYM[t]}</button>`).join('')}</div><input id="addInput" placeholder="${PH[addType]}" autocomplete="off" enterkeyhint="done" aria-label="${PH[addType]}"></div>`;
 h += `<div class="key"><span>• task</span><span>× done</span><span>&gt; moved</span><span>○ event</span><span>– note</span><span>★ priority</span><span class="hint">Tap an entry to edit, star, move or delete it.</span></div>`;

function streak(id, k){
 let n = 0, c = k;
 if (!state.days[c]?.habits?.[id]) c = addDays(c, -1);
 while (state.days[c]?.habits?.[id]) { n++; c = addDays(c, -1); }
 return n;
}

function renderHabits(k, d){

 for (const hb of state.habits){
  const done = !!d.habits[hb.id], s = streak(hb.id, k);
  h += `<span class="h-name">${esc(hb.name)}${s >= 2 ? `<span class="streak">${s} day streak</span>` : ''}</span>

 }

function section(id, title, inner, i){

/* ----- custom boxes ----- */
const cget = (c, k) => c.scope === 'shared' ? state.shared[c.id] : (state.days[k]?.custom || {})[c.id];
function cstore(c, k){ if (c.scope === 'shared') return state.shared; const d = dayW(k); if (!d.custom) d.custom = {}; return d.custom; }
const cset = (c, k, v) => { cstore(c, k)[c.id] = v; };
function clist(c, k){ const s = cstore(c, k); if (!Array.isArray(s[c.id])) s[c.id] = []; return s[c.id]; }

function renderCustom(c, k){
 const kept = c.scope === 'shared' ? '<p class="kept">Kept across all days</p>' : '';
 const v = cget(c, k);
 if (c.type === 'text') return `${kept}<textarea class="notes ctext" aria-label="${esc(c.title)}" placeholder="Write anything…">${esc(v || '')}</textarea>`;
 if (c.type === 'list'){
  const items = Array.isArray(v) ? v : [];
  return `${kept}<ul class="clist">${items.map(it => `<li class="cl-item ${it.done ? 'done' : ''} ${selId === it.id ? 'sel' : ''}" data-iid="${esc(it.id)}"><button class="cl-check" data-cl-toggle aria-pressed="${!!it.done}" aria-label="${it.done ? 'Uncheck' : 'Check'}">${shapeSvg(TH.habitShape, !!it.done)}</button><span class="txt cl-txt" contenteditable="true" spellcheck="true">${esc(it.text)}</span><button class="cl-del" data-cl-del aria-label="Delete item">×</button></li>`).join('')}</ul>
   <input class="cl-add" placeholder="Add an item…" autocomplete="off" enterkeyhint="done" aria-label="Add to ${esc(c.title)}">`;
 }
 if (c.type === 'tap'){
  const n = +v || 0, max = c.max || 8;
  return `<div class="lbl"><span>${esc(c.unit || '')}</span><em>${n} / ${max}</em></div><div class="waters">${Array.from({length:max}, (_,i) => `<button class="water-btn" data-tap="${i+1}" aria-label="${i+1}">${shapeSvg(c.icon || 'star', i < n)}</button>`).join('')}</div>`;
 }
 if (c.type === 'number'){
  const vals = [6,5,4,3,2,1,0].map(i => { const x = state.days[addDays(k, -i)]?.custom?.[c.id]; return (x === '' || x == null || isNaN(x)) ? null : +x; });
  const pts = vals.map((x,i) => x == null ? null : [i, x]).filter(Boolean);
  let spark = '';
  if (pts.length >= 2){
   const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), rng2 = hi - lo || 1;
   const xy = pts.map(([i,y]) => [8 + i * (264/6), 42 - ((y - lo) / rng2) * 34]);
   spark = `<div class="spark"><svg viewBox="0 0 280 50" preserveAspectRatio="none" aria-hidden="true"><polyline points="${xy.map(p => p.join(',')).join(' ')}" fill="none" style="stroke:var(--sat)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${xy.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--sa);stroke:var(--sat)" stroke-width="1.5"/>`).join('')}</svg><small>Last 7 days · low ${lo} · high ${hi}</small></div>`;
  }
  return `<div class="cnum-row"><input type="number" step="any" inputmode="decimal" class="cnum" value="${v == null ? '' : esc(v)}" placeholder="0" aria-label="${esc(c.title)}"><span class="cunit">${esc(c.unit || '')}</span></div>${spark}`;
 }
 return '';
}

function boxOrder(){
 const L = state.layout;
 let order = L.order.filter(id => !L.hidden[id]);
 if (L.mode === 'theme'){
  const preset = PRESETS[TH.layout].filter(id => order.includes(id));
  order = [...preset, ...order.filter(id => !BUILTIN[id])];
 }
 return order;
}
const narrowMQ = window.matchMedia('(max-width:820px)');
function boxHTML(id, k, d, i){
 switch (id){
  case 'log': return section(id, TH.titles.log, renderLog(k,d), i);
  case 'habits': return section(id, TH.titles.habits, renderHabits(k,d), i);
  case 'track': return section(id, TH.titles.track, renderTrack(k,d), i);
  case 'grat': return section(id, TH.titles.grat, renderGrat(k,d), i);
  case 'notes': return section(id, TH.titles.notes, renderNotes(k,d), i);
 }
 const c = state.custom[id];

}
function layoutBoxes(k, d){
 const flow = $('#flow'); let block = null;
 boxOrder().forEach((id, i) => {
  const html = boxHTML(id, k, d, i); if (!html) return;
  let target;
  if (state.layout.wide[id] || narrowMQ.matches){ block = null; target = flow; }
  else {
   if (!block){ flow.insertAdjacentHTML('beforeend', '<div class="cols"><div class="col"></div><div class="col"></div></div>'); const c = flow.lastElementChild; block = {cols:[c.children[0], c.children[1]], h:[0,0]}; }
   const side = block.h[0] <= block.h[1] ? 0 : 1;
   target = block.cols[side];
   target.insertAdjacentHTML('beforeend', html);
   target.lastElementChild.querySelectorAll('textarea.notes').forEach(autosize);
   block.h[side] += target.lastElementChild.offsetHeight + 28;
   return;
  }
  target.insertAdjacentHTML('beforeend', html);
  target.lastElementChild.querySelectorAll('textarea.notes').forEach(autosize);
 });
 if (!flow.children.length) flow.innerHTML = '<p class="empty" style="text-align:center">All boxes are hidden. Use “Arrange boxes” below to show some.</p>';
}

function weekStrip(k){

 }).join('')}</nav>`;

 applyTheme(TH);
 page.className = `page paper-${TH.paper} hdr-${TH.hdr} washi-${TH.washi} deco-${TH.deco} layout-${TH.layout}${TH.tilt ? ' tilt' : ''}`;

 page.style.setProperty('--cols', COLS[TH.layout]);
 $('#div1').style.backgroundImage = dividerURL(TH.divider, readable(TH.pal.a[TH.acc[0]-1], TH.pal.paper, TH.pal.ink, 2.2));

 $('#datePick').value = k;

 $('#menuTheme').innerHTML = `<span class="tname">${esc(TH.name)}${(d.roll||0) ? ` · look #${d.roll+1}` : ''}</span><span class="tsub">${esc(TH.sub)}</span>`;
 $('#themeChip').innerHTML = `<span class="swatches">${TH.pal.a.map(c => `<i style="background:${c}"></i>`).join('')}</span><span class="tinfo"><span class="tname">${esc(TH.name)}${(d.roll||0) ? ` <span style="color:#999;font-weight:400">· look #${d.roll+1}</span>` : ''}</span><span class="tsub">${esc(TH.sub)}</span></span>`;

function autosize(t){ if (!t) return; t.style.height = 'auto'; t.style.height = Math.max(150, t.scrollHeight + 4) + 'px'; }

/* =================== interactions =================== */
function go(k){ cur = k; render(true); window.scrollTo({top:0, behavior:'smooth'}); }
function rerender(){ const y = window.scrollY; render(false); window.scrollTo(0, y); }
function findItem(id){ const d = dayW(cur); return [d, d.items.findIndex(i => i.id === id)]; }

function selectRow(li){
 page.querySelectorAll('.item.sel,.cl-item.sel').forEach(x => { if (x !== li) x.classList.remove('sel'); });
 if (li){ li.classList.add('sel'); selId = li.dataset.id || li.dataset.iid; } else selId = null;
}
page.addEventListener('click', e => {
 const row = e.target.closest('.item,.cl-item');
 if (!e.target.closest('button')) selectRow(row);
 const t = e.target.closest('button'); if (!t) return;
 const k = cur;
 if (t.dataset.goto){ go(t.dataset.goto); return; }
 if (t.dataset.type){ addType = t.dataset.type; rerender(); $('#addInput').focus(); return; }
 if (t.dataset.act){
  const li = t.closest('.item'); const [d, idx] = findItem(li.dataset.id); if (idx < 0) return; const it = d.items[idx];
  if (t.dataset.act === 'toggle' && it.type === 'task') it.state = it.state === 'done' ? 'open' : 'done';
  if (t.dataset.act === 'pri') it.pri = !it.pri;
  if (t.dataset.act === 'del') d.items.splice(idx, 1);
  if (t.dataset.act === 'move'){ const nk = addDays(k, 1); dayW(nk).items.push({id:uid(), type:'task', text:it.text, state:'open', pri:it.pri}); it.state = 'migrated'; toast(`Moved to ${fmtShort(nk)}`); }
  save(); rerender(); return;
 }
 if (t.dataset.bring){
  const pd = state.days[t.dataset.bring], d = dayW(k); let n = 0;
  pd.items.forEach(it => { if (it.type === 'task' && (!it.state || it.state === 'open')){ d.items.push({id:uid(), type:'task', text:it.text, state:'open', pri:!!it.pri}); it.state = 'migrated'; n++; } });
  d.bringDone = true; save(); rerender(); toast(`Brought forward ${n} ${n === 1 ? 'task' : 'tasks'}`); return;
 }
 if (t.hasAttribute('data-dismiss')){ dayW(k).bringDone = true; save(); rerender(); return; }
 if (t.dataset.habit){ const d = dayW(k); if (d.habits[t.dataset.habit]) delete d.habits[t.dataset.habit]; else d.habits[t.dataset.habit] = true; save(); rerender(); return; }
 if (t.dataset.mood){ const d = dayW(k), v = +t.dataset.mood; d.mood = d.mood === v ? 0 : v; save(); rerender(); return; }
 if (t.dataset.water){ const d = dayW(k), v = +t.dataset.water; d.water = d.water === v ? v - 1 : v; save(); rerender(); return; }
 if (t.dataset.sleep){ const d = dayW(k); const step = +t.dataset.sleep; d.sleep = (!d.sleep && step > 0) ? 7 : Math.max(0, Math.min(14, (d.sleep || 0) + step)); save(); rerender(); return; }
 if (t.hasAttribute('data-edit-habits')){ openHabits(); return; }
 if (t.hasAttribute('data-addbox')){ openBoxEditor(null, false); return; }
 if (t.hasAttribute('data-arrange')){ openArrange(); return; }
 const sec = t.closest('.sec'), c = sec && state.custom[sec.dataset.sec];
 if (c && t.dataset.tap){ const v = +t.dataset.tap, n = +cget(c, k) || 0; cset(c, k, n === v ? v - 1 : v); save(); rerender(); return; }
 if (c && (t.hasAttribute('data-cl-toggle') || t.hasAttribute('data-cl-del'))){
  const arr = clist(c, k), idx = arr.findIndex(x => x.id === t.closest('.cl-item').dataset.iid); if (idx < 0) return;
  if (t.hasAttribute('data-cl-del')) arr.splice(idx, 1); else arr[idx].done = !arr[idx].done;
  save(); rerender(); return;
 }
});

page.addEventListener('keydown', e => {

  const text = e.target.value.trim(); if (!text) return;
  dayW(cur).items.push({id:uid(), type:addType, text, state:'open', pri:false});
  save(); rerender(); $('#addInput').focus();

  const text = e.target.value.trim(), c = state.custom[e.target.closest('.sec').dataset.sec]; if (!text || !c) return;
  clist(c, cur).push({id:uid(), text, done:false}); save(); rerender();
  page.querySelector(`.sec[data-sec="${c.id}"] .cl-add`)?.focus();
 }
 if (e.target.classList.contains('txt') && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
 if (e.target.classList.contains('txt') && e.key === 'Escape'){ e.target.blur(); }

page.addEventListener('focusout', e => {

let mRef;

function renderMonth(){
 const y = mRef.getFullYear(), m = mRef.getMonth(), first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, days = new Date(y, m+1, 0).getDate(), t = todayKey();
 let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => `<div class="dow">${x}</div>`).join('') + '<div></div>'.repeat(off);
 let done = 0, logged = 0, moods = [], sleeps = [], water = 0;
 for (let i = 1; i <= days; i++){
  const k = keyOf(new Date(y, m, i)), dd = state.days[k], th = genTheme(k, dd?.roll || 0);
  const hp = state.habits.length ? state.habits.filter(h => dd?.habits?.[h.id]).length / state.habits.length : 0;
  if (dd){ done += (dd.items || []).filter(x => x.type === 'task' && x.state === 'done').length; if (dd.mood) moods.push(dd.mood); if (dd.sleep) sleeps.push(dd.sleep); water += dd.water || 0; if (hasData(dd)) logged++; }

   <span><span class="sw">${th.pal.a.map(c => `<i style="background:${c}"></i>`).join('')}</span>${hp ? `<span class="hb"><i style="width:${Math.round(hp*100)}%"></i></span>` : ''}</span></button>`;
 }
 const avg = a => a.length ? a.reduce((s,v) => s+v, 0) / a.length : 0;
 const am = avg(moods);
 showModal(`<div class="mhead"><h3>${MO[m]} ${y}</h3><span style="display:flex;gap:6px"><button class="mbtn" data-mnav="-1" aria-label="Previous month">‹</button><button class="mbtn" data-mnav="1" aria-label="Next month">›</button><button class="mbtn" data-close aria-label="Close">×</button></span></div>
  <div class="cal">${cells}</div>
  <div class="mstats"><div><b>${logged}</b>days logged</div><div><b>${done}</b>tasks done</div><div><b>${am ? MOODS[Math.round(am)-1] : '—'}</b>typical mood</div><div><b>${sleeps.length ? fmtH(Math.round(avg(sleeps)*10)/10) : '—'}</b>avg sleep</div><div><b>${water}</b>glasses of water</div></div>
  <p class="mnote">Each day shows its theme colors. The dot is your mood; the bar is habits completed.</p>`);
}
modal.addEventListener('click', e => {
 const b = e.target.closest('button'); if (!b) return;
 if (b.dataset.mnav){ mRef.setMonth(mRef.getMonth() + +b.dataset.mnav); renderMonth(); }
 if (b.dataset.day){ const k = b.dataset.day; closeModal(); go(k); }
 if (b.dataset.rm){ state.habits = state.habits.filter(h => h.id !== b.dataset.rm); save(); renderHabitsModal(); return; }
 if (boxEditorClick(b)) return;
 arrangeClick(b);
});

/* ----- arrange boxes ----- */
const boxName = id => BUILTIN[id] || state.custom[id]?.title || id;
const boxKind = id => BUILTIN[id] ? 'Built-in' : (CTYPES[state.custom[id]?.type]?.label || '') + (state.custom[id]?.scope === 'shared' ? ' · kept across days' : '');
function setMine(){ state.layout.mode = 'mine'; }
function openArrange(){ onClose = () => rerender(); renderArrange(); }
function renderArrange(){
 const L = state.layout;
 showModal(`<div class="mhead"><h3>Arrange boxes</h3><button class="mbtn" data-close aria-label="Close">×</button></div>
  <div class="seg" role="group" aria-label="Who arranges"><button data-mode="theme" class="${L.mode === 'theme' ? 'on' : ''}">Theme shuffles daily</button><button data-mode="mine" class="${L.mode === 'mine' ? 'on' : ''}">Keep my order</button></div>
  <p class="mnote">${L.mode === 'theme' ? 'Each day’s theme shuffles the built-in boxes; your own boxes follow after. Moving anything switches to your order.' : 'Boxes appear top to bottom in this order, flowing into two columns on wide screens. Full-width boxes span both columns.'}</p>
  <ul class="arr" id="arrList">${L.order.map((id, i) => `<li class="arow ${L.hidden[id] ? 'off' : ''}" data-bid="${esc(id)}">
   <span class="grip" aria-hidden="true" title="Drag to reorder">⠿</span>
   <span class="aname">${esc(boxName(id))}<small>${esc(boxKind(id))}${L.hidden[id] ? ' · hidden' : ''}</small></span>
   <span class="actl">
    <button class="mbtn sm" data-up ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="mbtn sm" data-down ${i === L.order.length-1 ? 'disabled' : ''} aria-label="Move down">↓</button>
    <button class="mbtn sm" data-wide title="Width on wide screens">${L.wide[id] ? 'Full width' : 'Half width'}</button>
    <button class="mbtn sm" data-vis>${L.hidden[id] ? 'Show' : 'Hide'}</button>
    ${BUILTIN[id] ? '' : '<button class="mbtn sm" data-editbox>Edit</button><button class="mbtn sm" data-delbox>Delete</button>'}
   </span></li>`).join('')}</ul>
  <button class="mbtn dark" data-addbox-m>＋ Add a box</button>`);
 modal.querySelectorAll('.arow .grip').forEach(g => {
  g.onpointerdown = e => {
   e.preventDefault();
   const row = g.closest('.arow'), list = row.parentElement, id = row.dataset.bid;
   g.setPointerCapture(e.pointerId); row.classList.add('ghost');
   let target = null, after = false;
   const move = ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.arow');
    list.querySelectorAll('.arow.over').forEach(x => x.classList.remove('over'));
    target = el && el !== row && list.contains(el) ? el : null;
    if (target){ const r = target.getBoundingClientRect(); after = ev.clientY > r.top + r.height / 2; target.classList.add('over'); target.style.boxShadow = after ? '0 2px 0 #2d2d35' : '0 -2px 0 #2d2d35'; }
    list.querySelectorAll('.arow:not(.over)').forEach(x => x.style.boxShadow = '');
   };
   const up = () => {
    g.onpointermove = g.onpointerup = g.onpointercancel = null; row.classList.remove('ghost');
    if (target){ const o = state.layout.order; o.splice(o.indexOf(id), 1); let j = o.indexOf(target.dataset.bid); if (after) j++; o.splice(j, 0, id); setMine(); save(); }
    renderArrange();
   };
   g.onpointermove = move; g.onpointerup = up; g.onpointercancel = up;
  };
 });
}
function arrangeClick(b){
 const L = state.layout, row = b.closest('.arow'), id = row?.dataset.bid, o = L.order, i = id ? o.indexOf(id) : -1;
 if (b.dataset.mode){ L.mode = b.dataset.mode; save(); renderArrange(); return true; }
 if (b.hasAttribute('data-addbox-m')){ openBoxEditor(null, true); return true; }
 if (!row) return false;
 if (b.hasAttribute('data-up') && i > 0){ [o[i-1], o[i]] = [o[i], o[i-1]]; setMine(); }
 else if (b.hasAttribute('data-down') && i < o.length-1){ [o[i+1], o[i]] = [o[i], o[i+1]]; setMine(); }
 else if (b.hasAttribute('data-wide')){ if (L.wide[id]) delete L.wide[id]; else L.wide[id] = true; }
 else if (b.hasAttribute('data-vis')){ if (L.hidden[id]) delete L.hidden[id]; else L.hidden[id] = true; }
 else if (b.hasAttribute('data-editbox')){ openBoxEditor(id, true); return true; }
 else if (b.hasAttribute('data-delbox')){
  if (!confirm(`Delete “${boxName(id)}”? Its entries will be removed from every page.`)) return true;
  delete state.custom[id]; delete state.shared[id]; delete L.wide[id]; delete L.hidden[id]; o.splice(i, 1);
  Object.values(state.days).forEach(d => { if (d.custom) delete d.custom[id]; });
 } else return false;
 save(); renderArrange(); return true;
}

/* ----- add / edit a box ----- */
let draft = null, draftBack = false;
function openBoxEditor(id, back){
 draftBack = back;
 if (!back) onClose = () => rerender();
 draft = id ? Object.assign({}, state.custom[id]) : {id:null, title:'', type:'list', scope:'daily', icon:'star', max:8, unit:''};
 renderBoxEditor();
}
function renderBoxEditor(){
 const c = draft, editing = !!c.id;
 let opts = '';
 if (c.type === 'text' || c.type === 'list') opts = `<span class="fld">Keep entries</span><div class="radios"><label><input type="radio" name="bxScope" value="daily" ${c.scope !== 'shared' ? 'checked' : ''} ${editing ? 'disabled' : ''}> Fresh each day</label><label><input type="radio" name="bxScope" value="shared" ${c.scope === 'shared' ? 'checked' : ''} ${editing ? 'disabled' : ''}> Same on every day</label></div>`;
 if (c.type === 'tap') opts = `<div class="row2"><div><label class="fld" for="bxIcon">Icon</label><select class="fin" id="bxIcon">${Object.entries(TAP_ICONS).map(([k,v]) => `<option value="${k}" ${c.icon === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div><label class="fld" for="bxMax">How many</label><input class="fin" id="bxMax" type="number" min="1" max="20" value="${c.max || 8}"></div></div><label class="fld" for="bxUnit">Label (optional)</label><input class="fin" id="bxUnit" maxlength="24" placeholder="e.g. cups, sessions" value="${esc(c.unit || '')}">`;
 if (c.type === 'number') opts = `<label class="fld" for="bxUnit">Unit (optional)</label><input class="fin" id="bxUnit" maxlength="16" placeholder="e.g. steps, km, $" value="${esc(c.unit || '')}">`;
 showModal(`<div class="mhead"><h3>${editing ? 'Edit box' : 'Add a box'}</h3><button class="mbtn" data-close aria-label="Close">×</button></div>
  <label class="fld" for="bxTitle" style="margin-top:0">Title</label><input class="fin" id="bxTitle" maxlength="40" placeholder="e.g. Groceries, Steps, Coffee" value="${esc(c.title)}">
  <span class="fld">Type${editing ? ' <span style="font-weight:400;color:#999">(can’t change after creating)</span>' : ''}</span>
  <div class="tcards">${Object.entries(CTYPES).map(([k,t]) => `<button class="tcard ${c.type === k ? 'on' : ''}" data-ctype="${k}" ${editing ? 'disabled' : ''}><b>${t.label}</b><span>${t.desc}</span></button>`).join('')}</div>
  ${opts}
  <div class="mfoot"><button class="mbtn" data-bxcancel>Cancel</button><button class="mbtn dark" data-bxsave>${editing ? 'Save' : 'Add box'}</button></div>`);
 setTimeout(() => $('#bxTitle')?.focus(), 30);
}
function readDraft(){
 const c = draft;
 c.title = ($('#bxTitle')?.value || '').trim();
 const sc = modal.querySelector('input[name=bxScope]:checked'); if (sc) c.scope = sc.value;
 if ($('#bxIcon')) c.icon = $('#bxIcon').value;
 if ($('#bxMax')) c.max = Math.max(1, Math.min(20, parseInt($('#bxMax').value) || 8));
 if ($('#bxUnit')) c.unit = $('#bxUnit').value.trim();
}
function boxEditorClick(b){
 if (b.dataset.ctype){ readDraft(); draft.type = b.dataset.ctype; if (draft.type === 'tap' || draft.type === 'number') draft.scope = 'daily'; renderBoxEditor(); return true; }
 if (b.hasAttribute('data-bxcancel')){ if (draftBack) renderArrange(); else closeModal(); return true; }
 if (b.hasAttribute('data-bxsave')){
  readDraft(); const c = draft;
  if (!c.title) c.title = CTYPES[c.type].label;
  if (!c.id){ c.id = 'c' + uid(); state.layout.order.push(c.id); }
  const clean = {id:c.id, title:c.title, type:c.type, scope:(c.type === 'text' || c.type === 'list') ? c.scope : 'daily'};
  if (c.type === 'tap'){ clean.icon = c.icon; clean.max = c.max; clean.unit = c.unit; }
  if (c.type === 'number') clean.unit = c.unit;
  state.custom[c.id] = clean; save();
  if (draftBack) renderArrange(); else { closeModal(); toast(`Added “${clean.title}”`); }
  return true;
 }
 return false;
}

function openHabits(){ onClose = () => rerender(); renderHabitsModal(); }
function renderHabitsModal(){
 showModal(`<div class="mhead"><h3>Your habits</h3><button class="mbtn" data-close aria-label="Close">×</button></div>
  ${state.habits.map(h => `<div class="hrow"><input value="${esc(h.name)}" data-hid="${esc(h.id)}" aria-label="Habit name"><button class="mbtn" data-rm="${esc(h.id)}">Remove</button></div>`).join('') || '<p class="mnote">No habits yet — add one below.</p>'}
  <form class="hadd" id="habAdd"><input id="habNew" placeholder="New habit, e.g. Walk outside" maxlength="40"><button class="mbtn dark" type="submit">Add</button></form>
  <p class="mnote">Habits show up on every day's page. Removing one keeps its past check-ins hidden but safe.</p>`);
 modal.querySelector('#habAdd').onsubmit = e => { e.preventDefault(); const v = $('#habNew').value.trim(); if (!v) return; state.habits.push({id:'h' + uid(), name:v}); save(); renderHabitsModal(); $('#habNew').focus(); };
 modal.querySelectorAll('[data-hid]').forEach(inp => inp.oninput = () => { const h = state.habits.find(x => x.id === inp.dataset.hid); if (h){ h.name = inp.value.trim() || h.name; saveSoon(); } });
}

/* =================== backup =================== */
function exportData(){
 const name = `pagecraft-backup-${todayKey()}.json`, json = JSON.stringify(state, null, 2);
 const blob = new Blob([json], {type:'application/json'});
 if (window.matchMedia('(pointer:coarse)').matches && navigator.canShare){
  try {
   const file = new File([json], name, {type:'application/json'});
   if (navigator.canShare({files:[file]})){ navigator.share({files:[file], title:'Pagecraft backup'}).then(() => toast('Backup saved'), () => {}); return; }
  } catch (e) {}
 }
 const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
 document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
 toast('Backup downloaded');
}
$('#importFile').onchange = async e => {
 const f = e.target.files[0]; e.target.value = ''; if (!f) return;
 try {
  const data = JSON.parse(await f.text());
  if (!data || typeof data.days !== 'object' || !Array.isArray(data.habits)) throw new Error('bad');
  if (!confirm('Replace everything in this journal with the backup?')) return;
  state = data; normalize(); save(); render(true); toast('Backup restored');
 } catch (err) { toast("That file doesn't look like a Pagecraft backup"); }
};

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

render(true);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if (storageOK && navigator.storage && navigator.storage.persist){ navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => {}); }
})();
</script>
